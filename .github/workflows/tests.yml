name: CI Pipeline

# Milloin tämä putki käynnistyy?
on:
  push:
    branches:
      - main
      - master # Varmuuden vuoksi, jos päähaarasi on nimeltään master

# Mitä työtehtäviä suoritetaan?
jobs:
  test:
    runs-on: ubuntu-latest # GitHub antaa meille ilmaisen Linux-koneen

    steps:
      # A. Hae koodi sinun repositoriostasi tälle Linux-koneelle
      - name: Checkout code
        uses: actions/checkout@v4

      # Asenna Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # Voit muuttaa tämän vastaamaan omaa versiotasi

      # Asenna tarvittavat kirjastot
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      # Aja testit
      - name: Run Pytest
        run: pytest -v
