version: '3.8'

services:
  tietokanta:
    image: mysql:8.0
    container_name: kuopio_mysql
    restart: always
    environment:
      MYSQL_DATABASE: kuopio_decisions
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    
  api:
    build: .
    container_name: kuopio_api
    restart: always
    ports: 
      - "8000:8000"
    depends_on:
      - tietokanta
    env_file:
      - .env
  
  worker:
    build: .
    container_name: kuopio_worker
    restart: always
    depends_on:
      - tietokanta
    env_file:
      - .env
    command: ["python", "scheduler.py"]

volumes:
  mysql_data: